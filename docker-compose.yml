services:
  app:
    build: .
    container_name: ci4_app
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      CI_ENVIRONMENT: development

  db:
    image: mysql:8.0
    container_name: ci4_mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ci4_db
      MYSQL_USER: ci4_user
      MYSQL_PASSWORD: ci4_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
